apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdaltagent
  labels:
    app: pdaltagent
spec:
  replicas: 1  # scale horizontally for throughput (ensure shared RabbitMQ/Mongo)
  selector:
    matchLabels:
      app: pdaltagent
  template:
    metadata:
      labels:
        app: pdaltagent
    spec:
      containers:
        - name: pdaltagent
          image: martindstone/pdaltagent:0.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
            - containerPort: 9162
              name: snmp-trap
              protocol: UDP
          env:
            # Queue backend (RabbitMQ/AMQP). Point at your shared broker service.
            - name: CELERY_BROKER_URL
              value: amqp://pdaltagent:pdaltagent@rabbitmq:5672//
            # MongoDB connection for webhook polling/plugin storage.
            - name: MONGODB_URL
              value: mongodb://root:example@mongo:27017/
            # Admin credentials (consider sourcing from Secrets)
            - name: PDAGENTD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: pdaltagent-admin
                  key: user
            - name: PDAGENTD_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: pdaltagent-admin
                  key: password
            # Disable SNMP listener by default; enable and set routing key to ingest traps.
            - name: PDAGENTD_SNMP_ENABLED
              value: "false"
            - name: PDAGENTD_SNMP_PORT
              value: "9162"
            # Worker tuning examples; adjust to match CPU availability.
            - name: PDAGENTD_WORKER_CONCURRENCY
              value: "4"
            - name: PDAGENTD_PREFETCH_MULTIPLIER
              value: "4"
          volumeMounts:
            # Mount in-cluster plugins and their dependencies. Replace with PersistentVolumeClaims
            # or ConfigMap/Secret mounts if you want shared/plugin-managed code.
            - name: plugins
              mountPath: /usr/lib/python3.12/site-packages/pdaltagent/plugins
            - name: plugin-lib
              mountPath: /usr/lib/python3.12/site-packages/pdaltagent/plugin-lib
      volumes:
        - name: plugins
          emptyDir: {}  # Example: use emptyDir for ephemeral plugins during development
          # persistentVolumeClaim:
          #   claimName: pdaltagent-plugins-pvc
          # configMap:
          #   name: pdaltagent-plugins
        - name: plugin-lib
          emptyDir: {}  # Example: layer dependencies shared by plugins
          # persistentVolumeClaim:
          #   claimName: pdaltagent-plugin-lib-pvc
          # hostPath:
          #   path: /srv/pdaltagent/plugin-lib
