apiVersion: v1
kind: Service
metadata:
  name: pdaltagent
  labels:
    app: pdaltagent
spec:
  selector:
    app: pdaltagent
  ports:
    # HTTP/HTTPS endpoints for enqueueing events and UI
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
    # Optional SNMP trap listener (UDP)
    - name: snmp-trap
      protocol: UDP
      port: 9162
      targetPort: 9162
